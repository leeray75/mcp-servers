[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vision-mcp-server"
version = "0.1.0"
description = "Minimal MCP server that gives text-only agents image understanding by relaying images to a self-hosted vision model (OpenAI-compatible / LiteLLM)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
    "pillow>=11,<13",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "uv>=0.5",
]

[project.scripts]
vision-mcp = "vision_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=vision_mcp --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error::DeprecationWarning:vision_mcp.*"]

[tool.coverage.run]
source = ["src/vision_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and obviously fake credentials.
"tests/**" = ["S101", "S104", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["PIL.*"]
ignore_missing_imports = true
