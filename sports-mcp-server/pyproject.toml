[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sports-mcp-server"
version = "0.2.0"
description = "MCP server giving agents live, compact, correctly-labelled sports data (scores, schedules, standings, box scores, betting lines, headlines) from ESPN's public JSON API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "starlette>=0.40",
    "uvicorn>=0.32",
    # Slim container images ship no IANA time zone database; zoneinfo needs this.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "uv>=0.5",
]

[project.scripts]
sports-mcp = "sports_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls the real ESPN API (opt-in: pytest -m live --no-cov)"]
addopts = "-ra --strict-markers -m 'not live' --cov=sports_mcp --cov-report=term-missing --cov-fail-under=90"
filterwarnings = ["error::DeprecationWarning:sports_mcp.*"]

[tool.coverage.run]
source = ["src/sports_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and obviously fake credentials.
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "E501"]
"tools/**" = ["S310", "S101", "E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
