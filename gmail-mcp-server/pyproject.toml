[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gmail-mcp-server"
version = "0.2.0"
description = "Minimal, locally hosted MCP server: read Gmail and create drafts. No send, delete or modify tools."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "google-api-python-client>=2.150,<3",
    "google-auth>=2.35,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "httplib2>=0.22,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "starlette>=0.40",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "uv>=0.5",
]

[project.scripts]
gmail-mcp = "gmail_mcp.__main__:main"
gmail-mcp-auth = "gmail_mcp.auth_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=gmail_mcp --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error::DeprecationWarning:gmail_mcp.*"]

[tool.coverage.run]
source = ["src/gmail_mcp"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert and obviously fake credentials.
"tests/**" = ["S101", "S104", "S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
# google-auth exception constructors are untyped; tests build them directly.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_httplib2",
    "google_auth_oauthlib.*",
    "httplib2",
]
ignore_missing_imports = true
